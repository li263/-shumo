    <script>
        // 页面加载完成后显示
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
            initApp();
        });

        function initApp() {
            // ===================== 全局变量 =====================
            let currentChart = null;
            const modelSelect = document.getElementById('modelSelect');
            const paramInputs = document.getElementById('paramInputs');
            const calculateBtn = document.getElementById('calculateBtn');
            const themeToggle = document.getElementById('themeToggle');
            const addRowBtn = document.getElementById('addRowBtn');
            const delRowBtn = document.getElementById('delRowBtn');
            const importCsvBtn = document.getElementById('importCsvBtn');
            const csvInput = document.getElementById('csvInput');
            const tableBody = document.getElementById('tableBody');
            const tableHeader = document.getElementById('tableHeader');
            const formulaArea = document.getElementById('formulaArea');
            const resultBody = document.getElementById('resultBody');
            const reportArea = document.getElementById('reportArea');
            const copyReportBtn = document.getElementById('copyReportBtn');

            // ===================== 主题切换 =====================
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                updateChartTheme();
            });

            // ===================== 模型参数动态生成 =====================
            const modelParams = {
                gray: [{ label: '预测步数', key: 'predictStep', value: 3 }],
                regression: [{ label: '多项式阶数', key: 'order', value: 1 }],
                ahp: [{ label: '准则数量', key: 'criteriaNum', value: 4 }],
                topsis: [{ label: '权重(逗号分隔)', key: 'weights', value: '0.3,0.3,0.2,0.2' }],
                bp: [{ label: '隐藏层节点', key: 'hidden', value: 5 }, { label: '迭代次数', key: 'epochs', value: 1000 }],
                ga: [{ label: '种群大小', key: 'popSize', value: 50 }, { label: '迭代次数', key: 'iter', value: 100 }]
            };

            function renderParams() {
                const model = modelSelect.value;
                const params = modelParams[model];
                paramInputs.innerHTML = '';
                params.forEach(p => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <label class="text-xs text-gray-600 dark:text-gray-400">${p.label}</label>
                        <input type="text" data-key="${p.key}" value="${p.value}" 
                            class="w-full px-2 py-1 text-sm border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 focus:ring-1 focus:ring-primary outline-none">
                    `;
                    paramInputs.appendChild(div);
                });
            }

            modelSelect.addEventListener('change', renderParams);
            renderParams();

            // ===================== 表格操作 =====================
            // 添加行
            addRowBtn.addEventListener('click', () => {
                const rowCount = tableBody.children.length;
                const colCount = tableHeader.children.length - 1;
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 dark:hover:bg-gray-800/50';
                
                let tdHtml = `<td class="px-2 py-1.5 text-center text-gray-500 border-r border-gray-300 dark:border-gray-600">${rowCount + 1}</td>`;
                for (let i = 0; i < colCount; i++) {
                    tdHtml += `<td class="px-2 py-1.5 ${i < colCount - 1 ? 'border-r border-gray-300 dark:border-gray-600' : ''}" contenteditable="true">0</td>`;
                }
                tr.innerHTML = tdHtml;
                tableBody.appendChild(tr);
            });

            // 删除行
            delRowBtn.addEventListener('click', () => {
                if (tableBody.children.length > 1) {
                    tableBody.removeChild(tableBody.lastElementChild);
                }
            });

            // CSV导入
            importCsvBtn.addEventListener('click', () => {
                const text = csvInput.value.trim();
                if (!text) return;
                
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length === 0) return;

                // 处理表头
                const headers = lines[0].split(/[,，\t]/).map(h => h.trim());
                tableHeader.innerHTML = '<th class="px-2 py-1.5 border-r border-gray-300 dark:border-gray-600 w-10">序号</th>';
                headers.forEach((h, i) => {
                    const th = document.createElement('th');
                    th.className = `px-2 py-1.5 ${i < headers.length - 1 ? 'border-r border-gray-300 dark:border-gray-600' : ''}`;
                    th.contentEditable = 'true';
                    th.textContent = h;
                    tableHeader.appendChild(th);
                });

                // 处理数据行
                tableBody.innerHTML = '';
                lines.slice(1).forEach((line, idx) => {
                    const values = line.split(/[,，\t]/).map(v => v.trim());
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 dark:hover:bg-gray-800/50';
                    
                    let tdHtml = `<td class="px-2 py-1.5 text-center text-gray-500 border-r border-gray-300 dark:border-gray-600">${idx + 1}</td>`;
                    values.forEach((v, i) => {
                        tdHtml += `<td class="px-2 py-1.5 ${i < values.length - 1 ? 'border-r border-gray-300 dark:border-gray-600' : ''}" contenteditable="true">${v}</td>`;
                    });
                    tr.innerHTML = tdHtml;
                    tableBody.appendChild(tr);
                });

                csvInput.value = '';
            });

            // 读取表格数据
            function getTableData() {
                const rows = Array.from(tableBody.children);
                const data = [];
                rows.forEach(row => {
                    const cells = Array.from(row.children).slice(1);
                    const rowData = cells.map(cell => parseFloat(cell.textContent.trim()) || 0);
                    data.push(rowData);
                });
                return data;
            }

            // ===================== 算法实现 =====================

            // 1. 灰色预测 GM(1,1)
            function grayPrediction(data, predictStep) {
                const x0 = data.map(d => d[d.length - 1]);
                const n = x0.length;
                
                const x1 = [];
                let sum = 0;
                x0.forEach(v => { sum += v; x1.push(sum); });
                
                const z = [];
                for (let i = 1; i < n; i++) {
                    z.push(0.5 * x1[i] + 0.5 * x1[i-1]);
                }
                
                let sumZ = 0, sumX0 = 0, sumZX0 = 0, sumZ2 = 0;
                for (let i = 0; i < z.length; i++) {
                    sumZ += z[i];
                    sumX0 += x0[i+1];
                    sumZX0 += z[i] * x0[i+1];
                    sumZ2 += z[i] * z[i];
                }
                const B = n - 1;
                const a = (sumZ * sumX0 / B - sumZX0) / (sumZX0 - sumZ2 * sumZ / B);
                const b = (sumX0 + a * sumZ) / B;
                
                const predict = [];
                for (let k = 0; k < n + predictStep; k++) {
                    const val = (x0[0] - b/a) * Math.exp(-a * k) + b/a;
                    predict.push(val);
                }
                
                const predict0 = [x0[0]];
                for (let k = 1; k < predict.length; k++) {
                    predict0.push(predict[k] - predict[k-1]);
                }
                
                return {
                    params: { a, b },
                    original: x0,
                    predicted: predict0,
                    formula: '\\hat{x}^{(1)}(k+1) = \\left(x^{(1)}(0) - \\frac{b}{a}\\right)e^{-ak} + \\frac{b}{a}'
                };
            }

            // 2. 多元线性回归
            function linearRegression(data) {
                const n = data.length;
                const y = data.map(d => d[d.length - 1]);
                const X = data.map(d => [1, ...d.slice(0, -1)]);
                const k = X[0].length;
                
                const transpose = (m) => m[0].map((_, i) => m.map(row => row[i]));
                
                const multiply = (A, B) => {
                    const result = [];
                    for (let i = 0; i < A.length; i++) {
                        result[i] = [];
                        for (let j = 0; j < B[0].length; j++) {
                            let sum = 0;
                            for (let k = 0; k < A[0].length; k++) {
                                sum += A[i][k] * B[k][j];
                            }
                            result[i][j] = sum;
                        }
                    }
                    return result;
                };
                
                const Xt = transpose(X);
                const XtX = multiply(Xt, X);
                const Xty = multiply(Xt, [y].map(row => row));
                
                // 梯度下降求解
                let beta = Array(k).fill(0);
                const lr = 0.01;
                for (let iter = 0; iter < 5000; iter++) {
                    const yPred = X.map(row => row.reduce((s, v, i) => s + v * beta[i], 0));
                    const error = y.map((v, i) => v - yPred[i]);
                    const gradient = Xt.map(row => row.reduce((s, v, i) => s + v * error[i], 0) * (-2/n));
                    beta = beta.map((b, i) => b - lr * gradient[i]);
                }
                
                const yFit = X.map(row => row.reduce((s, v, i) => s + v * beta[i], 0));
                
                const yMean = y.reduce((a, b) => a + b) / n;
                const ssTotal = y.reduce((s, v) => s + (v - yMean)**2, 0);
                const ssRes = y.reduce((s, v, i) => s + (v - yFit[i])**2, 0);
                const r2 = 1 - ssRes / ssTotal;
                
                return {
                    coefficients: beta,
                    fitted: yFit,
                    original: y,
                    r2,
                    formula: 'y = \\beta_0 + \\beta_1 x_1 + \\beta_2 x_2 + \\dots + \\beta_k x_k + \\varepsilon'
                };
            }

            // 3. AHP 层次分析法
            function ahpCalculate(data) {
                const n = data.length;
                const matrix = data;
                
                const colSum = matrix[0].map((_, j) => matrix.reduce((s, row) => s + row[j], 0));
                const normMatrix = matrix.map(row => row.map((v, j) => v / colSum[j]));
                
                const weights = normMatrix.map(row => {
                    const sum = row.reduce((a, b) => a + b, 0);
                    return sum / n;
                });
                
                const weightedSum = matrix.map((row, i) => 
                    row.reduce((s, v, j) => s + v * weights[j], 0) / weights[i]
                );
                const lambdaMax = weightedSum.reduce((a, b) => a + b, 0) / n;
                
                const ci = (lambdaMax - n) / (n - 1);
                const riTable = {1:0, 2:0, 3:0.58, 4:0.90, 5:1.12, 6:1.24, 7:1.32, 8:1.41, 9:1.45};
                const ri = riTable[n] || 1.45;
                const cr = ci / ri;
                
                return {
                    weights,
                    lambdaMax,
                    ci,
                    cr,
                    consistent: cr < 0.1,
                    formula: 'CR = \\frac{CI}{RI}, \\quad CI = \\frac{\\lambda_{max} - n}{n-1}'
                };
            }

            // 4. TOPSIS
            function topsisCalculate(data, weights) {
                const n = data.length;
                const m = data[0].length;
                
                const norm = Array(m).fill(0);
                data.forEach(row => {
                    row.forEach((v, j) => norm[j] += v * v);
                });
                for (let j = 0; j < m; j++) {
                    norm[j] = Math.sqrt(norm[j]);
                }
                
                const normData = data.map(row => row.map((v, j) => v / norm[j]));
                const weightedData = normData.map(row => row.map((v, j) => v * weights[j]));
                
                const idealBest = weightedData[0].map((_, j) => Math.max(...weightedData.map(r => r[j])));
                const idealWorst = weightedData[0].map((_, j) => Math.min(...weightedData.map(r => r[j])));
                
                const distBest = weightedData.map(row => 
                    Math.sqrt(row.reduce((s, v, j) => s + (v - idealBest[j])**2, 0))
                );
                const distWorst = weightedData.map(row => 
                    Math.sqrt(row.reduce((s, v, j) => s + (v - idealWorst[j])**2, 0))
                );
                
                const score = distBest.map((d, i) => distWorst[i] / (d + distWorst[i]));
                
                const ranked = score.map((s, i) => ({ index: i+1, score: s }))
                    .sort((a, b) => b.score - a.score);
                
                return {
                    scores: score,
                    ranking: ranked,
                    formula: 'C_i = \\frac{D_i^-}{D_i^+ + D_i^-}'
                };
            }

            // 5. BP神经网络
            function bpNetwork(data, hiddenSize, epochs) {
                const X = data.map(d => d.slice(0, -1));
                const y = data.map(d => [d[d.length - 1]]);
                const inputSize = X[0].length;
                const lr = 0.1;
                
                let W1 = Array.from({length: inputSize}, () => 
                    Array.from({length: hiddenSize}, () => Math.random() * 2 - 1)
                );
                let b1 = Array(hiddenSize).fill(0.1);
                let W2 = Array.from({length: hiddenSize}, () => 
                    Array.from({length: 1}, () => Math.random() * 2 - 1)
                );
                let b2 = Array(1).fill(0.1);
                
                const sigmoid = x => 1 / (1 + Math.exp(-x));
                const sigmoidDeriv = x => x * (1 - x);
                
                const losses = [];
                
                for (let epoch = 0; epoch < epochs; epoch++) {
                    let totalLoss = 0;
                    
                    for (let i = 0; i < X.length; i++) {
                        const hidden = b1.map((b, j) => 
                            sigmoid(X[i].reduce((s, x, k) => s + x * W1[k][j], 0) + b)
                        );
                        
                        const output = b2.map((b, j) => 
                            hidden.reduce((s, h, k) => s + h * W2[k][j], 0) + b
                        );
                        
                        const error = output.map((o, j) => y[i][j] - o);
                        totalLoss += error.reduce((s, e) => s + e*e, 0);
                        
                        const dOutput = error;
                        const dHidden = hidden.map((h, j) => 
                            dOutput.reduce((s, e, k) => s + e * W2[j][k], 0) * sigmoidDeriv(h)
                        );
                        
                        for (let j = 0; j < hiddenSize; j++) {
                            for (let k = 0; k < 1; k++) {
                                W2[j][k] += lr * hidden[j] * dOutput[k];
                            }
                        }
                        b2 = b2.map((b, j) => b + lr * dOutput[j]);
                        
                        for (let j = 0; j < inputSize; j++) {
                            for (let k = 0; k < hiddenSize; k++) {
                                W1[j][k] += lr * X[i][j] * dHidden[k];
                            }
                        }
                        b1 = b1.map((b, j) => b + lr * dHidden[j]);
                    }
                    
                    losses.push(totalLoss / X.length);
                }
                
                const predictions = X.map(x => {
                    const hidden = b1.map((b, j) => 
                        sigmoid(x.reduce((s, xi, k) => s + xi * W1[k][j], 0) + b)
                    );
                    return b2.map((b, j) => hidden.reduce((s, h, k) => s + h * W2[k][j], 0) + b)[0];
                });
                
                return {
                    predictions,
                    losses,
                    original: y.map(v => v[0]),
                    formula: '\\sigma(x) = \\frac{1}{1+e^{-x}}, \\quad \\hat{y} = W_2 \\sigma(W_1 x + b_1) + b_2'
                };
            }

            // 6. 遗传算法
            function geneticAlgorithm(popSize, iter) {
                const fitness = x => x * Math.sin(10 * Math.PI * x) + 2.0;
                
                const encode = x => {
                    const normalized = (x + 1) / 3;
                    const intVal = Math.round(normalized * (Math.pow(2, 16) - 1));
                    return intVal.toString(2).padStart(16, '0');
                };
                
                const decode = chrom => {
                    const intVal = parseInt(chrom, 2);
                    const normalized = intVal / (Math.pow(2, 16) - 1);
                    return normalized * 3 - 1;
                };
                
                let population = Array.from({length: popSize}, () => 
                    encode(Math.random() * 3 - 1)
                );
                
                const bestHistory = [];
                
                for (let gen = 0; gen < iter; gen++) {
                    const fits = population.map(chrom => fitness(decode(chrom)));
                    const minFit = Math.min(...fits);
                    const adjFits = fits.map(f => f - minFit + 0.001);
                    const totalFit = adjFits.reduce((a, b) => a + b, 0);
                    
                    const bestIdx = fits.indexOf(Math.max(...fits));
                    bestHistory.push(fits[bestIdx]);
                    
                    const newPop = [];
                    for (let i = 0; i < popSize; i++) {
                        let r = Math.random() * totalFit;
                        let sum = 0;
                        for (let j = 0; j < popSize; j++) {
                            sum += adjFits[j];
                            if (sum >= r) {
                                newPop.push(population[j]);
                                break;
                            }
                        }
                    }
                    population = newPop;
                    
                    for (let i = 0; i < popSize; i += 2) {
                        if (Math.random() < 0.8 && i + 1 < popSize) {
                            const point = Math.floor(Math.random() * 15) + 1;
                            const c1 = population[i].slice(0, point) + population[i+1].slice(point);
                            const c2 = population[i+1].slice(0, point) + population[i].slice(point);
                            population[i] = c1;
                            population[i+1] = c2;
                        }
                    }
                    
                    population = population.map(chrom => 
                        chrom.split('').map(gene => 
                            Math.random() < 0.01 ? (gene === '0' ? '1' : '0') : gene
                        ).join('')
                    );
                }
                
                const finalFits = population.map(chrom => fitness(decode(chrom)));
                const bestIdx = finalFits.indexOf(Math.max(...finalFits));
                const bestX = decode(population[bestIdx]);
                const bestFitness = finalFits[bestIdx];
                
                return {
                    bestX,
                    bestFitness,
                    convergence: bestHistory,
                    formula: '\\max f(x) = x \\sin(10\\pi x) + 2.0, \\quad x \\in [-1, 2]'
                };
            }

            // ===================== 结果渲染 =====================
            
            function renderResult(model, result) {
                // 公式渲染
                formulaArea.innerHTML = '$$' + result.formula + '$$';
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([formulaArea]).catch(() => {});
                }
                
                // 结果表格
                resultBody.innerHTML = '';
                
                if (model === 'gray') {
                    addResultRow('发展系数 a', result.params.a.toFixed(6));
                    addResultRow('灰作用量 b', result.params.b.toFixed(6));
                    addResultRow('原始序列长度', result.original.length);
                    addResultRow('预测步数', result.predicted.length - result.original.length);
                } else if (model === 'regression') {
                    result.coefficients.forEach((b, i) => {
                        addResultRow(`系数 β${i}`, b.toFixed(6));
                    });
                    addResultRow('决定系数 R²', result.r2.toFixed(6));
                } else if (model === 'ahp') {
                    result.weights.forEach((w, i) => {
                        addResultRow(`准则 ${i+1} 权重`, w.toFixed(6));
                    });
                    addResultRow('最大特征值 λmax', result.lambdaMax.toFixed(6));
                    addResultRow('一致性指标 CI', result.ci.toFixed(6));
                    addResultRow('一致性比例 CR', result.cr.toFixed(6));
                    addResultRow('一致性检验', result.consistent ? '通过 (CR<0.1)' : '未通过');
                } else if (model === 'topsis') {
                    result.scores.forEach((s, i) => {
                        addResultRow(`方案 ${i+1} 得分`, s.toFixed(6));
                    });
                    addResultRow('最优方案', `方案 ${result.ranking[0].index}`);
                } else if (model === 'bp') {
                    addResultRow('隐藏层节点数', hiddenSize || 5);
                    addResultRow('迭代次数', epochs || 1000);
                    addResultRow('最终损失', result.losses[result.losses.length - 1].toFixed(6));
                } else if (model === 'ga') {
                    addResultRow('最优解 x', result.bestX.toFixed(6));
                    addResultRow('最优适应度', result.bestFitness.toFixed(6));
                    addResultRow('迭代次数', result.convergence.length);
                }
            }

            function addResultRow(label, value) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-3 py-2 border border-gray-200 dark:border-gray-600">${label}</td>
                    <td class="px-3 py-2 border border-gray-200 dark:border-gray-600 font-mono">${value}</td>
                `;
                resultBody.appendChild(tr);
            }

            // ===================== 图表渲染 =====================
            
            function renderChart(model, result) {
                if (currentChart) {
                    currentChart.destroy();
                }
                
                const ctx = document.getElementById('resultChart').getContext('2d');
                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#cbd5e1' : '#374151';
                const gridColor = isDark ? '#374151' : '#e5e7eb';
                
                let config = {
                    type: 'line',
                    data: {},
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: textColor } }
                        },
                        scales: {
                            x: { ticks: { color: textColor }, grid: { color: gridColor } },
                            y: { ticks: { color: textColor }, grid: { color: gridColor } }
                        }
                    }
                };
                
                if (model === 'gray') {
                    const labels = Array.from({length: result.predicted.length}, (_, i) => i + 1);
                    const originalData = [...result.original];
                    while (originalData.length < result.predicted.length) {
                        originalData.push(null);
                    }
                    config.data = {
                        labels,
                        datasets: [
                            {
                                label: '原始数据',
                                data: originalData,
                                borderColor: '#2563eb',
                                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                                tension: 0.2,
                                pointRadius: 4
                            },
                            {
                                label: '预测值',
                                data: result.predicted,
                                borderColor: '#f59e0b',
                                borderDash: [5, 5],
                                tension: 0.2,
                                pointRadius: 3
                            }
                        ]
                    };
                } else if (model === 'regression') {
                    const labels = Array.from({length: result.original.length}, (_, i) => i + 1);
                    config.data = {
                        labels,
                        datasets: [
                            {
                                label: '实际值',
                                data: result.original,
                                borderColor: '#2563eb',
                                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                                tension: 0.2,
                                pointRadius: 4
                            },
                            {
                                label: '拟合值',
                                data: result.fitted,
                                borderColor: '#10b981',
                                tension: 0.2,
                                pointRadius: 3
                            }
                        ]
                    };
                } else if (model === 'ahp') {
                    config.type = 'bar';
                    config.data = {
                        labels: result.weights.map((_, i) => `准则${i+1}`),
                        datasets: [{
                            label: '权重值',
                            data: result.weights,
                            backgroundColor: 'rgba(37, 99, 235, 0.7)',
                            borderRadius: 4
                        }]
                    };
                } else if (model === 'topsis') {
                    config.type = 'bar';
                    config.data = {
                        labels: result.scores.map((_, i) => `方案${i+1}`),
                        datasets: [{
                            label: '贴近度得分',
                            data: result.scores,
                            backgroundColor: 'rgba(16, 185, 129, 0.7)',
                            borderRadius: 4
                        }]
                    };
                } else if (model === 'bp') {
                    config.data = {
                        labels: Array.from({length: result.losses.length}, (_, i) => i + 1),
                        datasets: [{
                            label: '损失函数值',
                            data: result.losses,
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            tension: 0.3,
                            pointRadius: 0
                        }]
                    };
                } else if (model === 'ga') {
                    config.data = {
                        labels: Array.from({length: result.convergence.length}, (_, i) => i + 1),
                        datasets: [{
                            label: '最优适应度',
                            data: result.convergence,
                            borderColor: '#8b5cf6',
                            backgroundColor: 'rgba(139, 92, 246, 0.1)',
                            tension: 0.3,
                            pointRadius: 0
                        }]
                    };
                }
                
                currentChart = new Chart(ctx, config);
            }

            function updateChartTheme() {
                if (!currentChart) return;
                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#cbd5e1' : '#374151';
                const gridColor = isDark ? '#374151' : '#e5e7eb';
                
                currentChart.options.plugins.legend.labels.color = textColor;
                currentChart.options.scales.x.ticks.color = textColor;
                currentChart.options.scales.y.ticks.color = textColor;
                currentChart.options.scales.x.grid.color = gridColor;
                currentChart.options.scales.y.grid.color = gridColor;
                currentChart.update();
            }

            // ===================== 生成报告 =====================
            
            function generateReport(model, result, problem) {
                const modelNames = {
                    gray: '灰色预测 GM(1,1) 模型',
                    regression: '多元线性回归模型',
                    ahp: '层次分析法 AHP 模型',
                    topsis: 'TOPSIS 优劣解距离模型',
                    bp: 'BP 神经网络模型',
                    ga: '遗传算法模型'
                };
                
                let report = `# 数学建模报告\n\n## 一、问题描述\n${problem || '未输入问题描述'}\n\n## 二、模型选择\n采用 **${modelNames[model]}** 进行求解。\n\n## 三、模型假设\n1. 数据真实可靠，无异常值干扰\n2. 模型适用条件满足，系统变化符合模型基本假设\n3. 计算过程中数值误差在可接受范围内\n\n## 四、模型公式\n$$\n${result.formula}\n$$\n\n## 五、计算结果\n\n`;
                
                if (model === 'gray') {
                    report += `- 发展系数 a = ${result.params.a.toFixed(6)}\n`;
                    report += `- 灰作用量 b = ${result.params.b.toFixed(6)}\n`;
                    report += `- 预测结果：${result.predicted.map(v => v.toFixed(3)).join(', ')}\n`;
                } else if (model === 'regression') {
                    report += `- 回归系数：${result.coefficients.map(v => v.toFixed(6)).join(', ')}\n`;
                    report += `- 决定系数 R² = ${result.r2.toFixed(6)}\n`;
                } else if (model === 'ahp') {
                    report += `- 各准则权重：${result.weights.map(v => v.toFixed(6)).join(', ')}\n`;
                    report += `- 一致性比例 CR = ${result.cr.toFixed(6)} ${result.consistent ? '(通过检验)' : '(未通过检验)'}\n`;
                } else if (model === 'topsis') {
                    report += `- 各方案得分：${result.scores.map(v => v.toFixed(6)).join(', ')}\n`;
                    report += `- 最优方案：方案 ${result.ranking[0].index}\n`;
                } else if (model === 'bp') {
                    report += `- 网络结构：输入层-${result.original.length} 隐藏层-5 输出层-1\n`;
                    report += `- 最终损失：${result.losses[result.losses.length - 1].toFixed(6)}\n`;
                } else if (model === 'ga') {
                    report += `- 最优解 x = ${result.bestX.toFixed(6)}\n`;
                    report += `- 最优适应度 = ${result.bestFitness.toFixed(6)}\n`;
                }
                
                report += `\n## 六、结果分析\n根据模型计算结果，可得出相应决策建议。模型计算结果与实际情况基本吻合，具有一定参考价值。\n\n## 七、模型评价\n### 优点\n1. 模型原理清晰，计算简便\n2. 对数据量要求较低，适用性广\n3. 结果直观，易于解释\n\n### 缺点\n1. 模型假设较强，适用范围有限\n2. 未考虑更多影响因素，可能存在偏差\n`;
                
                reportArea.value = report;
            }

            // ===================== 计算主逻辑 =====================
            
            calculateBtn.addEventListener('click', () => {
                const model = modelSelect.value;
                const data = getTableData();
                const problem = document.getElementById('problemTitle').value;
                
                if (data.length === 0) {
                    alert('请输入数据');
                    return;
                }
                
                let result;
                
                const paramInputEls = document.querySelectorAll('#paramInputs input');
                const params = {};
                paramInputEls.forEach(input => {
                    params[input.dataset.key] = input.value;
                });
                
                try {
                    switch (model) {
                        case 'gray':
                            result = grayPrediction(data, parseInt(params.predictStep) || 3);
                            break;
                        case 'regression':
                            result = linearRegression(data);
                            break;
                        case 'ahp':
                            result = ahpCalculate(data);
                            break;
                        case 'topsis':
                            const weights = params.weights.split(',').map(v => parseFloat(v.trim()));
                            result = topsisCalculate(data, weights);
                            break;
                        case 'bp':
                            result = bpNetwork(data, parseInt(params.hidden) || 5, parseInt(params.epochs) || 1000);
                            break;
                        case 'ga':
                            result = geneticAlgorithm(parseInt(params.popSize) || 50, parseInt(params.iter) || 100);
                            break;
                    }
                    
                    renderResult(model, result);
                    renderChart(model, result);
                    generateReport(model, result, problem);
                    
                } catch (e) {
                    alert('计算出错：' + e.message);
                    console.error(e);
                }
            });

            // ===================== 复制报告 =====================
            copyReportBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(reportArea.value);
                    copyReportBtn.textContent = '已复制';
                    setTimeout(() => {
                        copyReportBtn.textContent = '复制报告';
                    }, 1500);
                } catch (e) {
                    // 降级方案
                    reportArea.select();
                    document.execCommand('copy');
                    copyReportBtn.textContent = '已复制';
                    setTimeout(() => {
                        copyReportBtn.textContent = '复制报告';
                    }, 1500);
                }
            });
        }
    </script>
